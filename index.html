<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Unfold</title>
<style>
/* ============================================================
   UNFOLD v1.0 — infinite canvas notes, by KODIAK
   Ultra-minimal: the canvas IS the app. Themes: White / Off-white / Black.
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#1a1a1a;
  position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
body[data-theme="offwhite"]{background:#f6f1e7;color:#2a2620}
body[data-theme="black"]{background:#000;color:#f2f2f2}
#board{position:fixed;inset:0;touch-action:none;display:block;cursor:crosshair}
body[data-mode="draw"] #board{cursor:crosshair}
body[data-mode="capture"] #board{cursor:crosshair}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:200;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;transition:opacity .45s ease}
body[data-theme="offwhite"] #splash{background:#f6f1e7}
body[data-theme="black"] #splash{background:#000}
#splash.gone{opacity:0;pointer-events:none}
#splash .mark{width:84px;height:84px;animation:markin 1.1s cubic-bezier(.2,.9,.3,1.2) both}
#splash .word{font-size:2rem;font-weight:800;letter-spacing:-.03em;color:#1a1a1a;
  animation:wordin 1.1s ease .15s both}
body[data-theme="offwhite"] #splash .word{color:#2a2620}
body[data-theme="black"] #splash .word{color:#f2f2f2}
#splash .by{font-size:.72rem;letter-spacing:.32em;color:#9a9a9a;font-weight:600;animation:wordin 1.1s ease .3s both}
@keyframes markin{from{opacity:0;transform:scale(.6) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes wordin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- floating buttons ---------- */
.fabs{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;
  display:flex;flex-direction:column;gap:10px;transition:opacity .5s}
.fabs.dim{opacity:.4}
.fab{width:52px;height:52px;border-radius:50%;border:none;font-size:1.35rem;cursor:pointer;
  background:#1a1a1a;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:22px;height:22px;display:block}
@media (pointer:coarse){
  .fabs{gap:8px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
  .fab{width:44px;height:44px}
  .fab svg{width:19px;height:19px}
}
.fab.on{background:#2f7d4f}
body[data-theme="offwhite"] .fab{background:#2a2620}
body[data-theme="black"] .fab{background:#f2f2f2;color:#000}
body[data-theme="black"] .fab.on{background:#7cc79b;color:#062015}
.zoomctl{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top));z-index:50;
  display:flex;flex-direction:column;gap:6px;transition:opacity .5s}
.zoomctl.dim{opacity:.4}
.zoomctl button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(0,0,0,.12);
  background:rgba(255,255,255,.85);font-size:1.2rem;font-weight:700;color:#1a1a1a;cursor:pointer}
body[data-theme="offwhite"] .zoomctl button{background:rgba(255,255,255,.85);color:#2a2620}
body[data-theme="black"] .zoomctl button{background:rgba(20,20,20,.85);color:#f2f2f2;border-color:rgba(255,255,255,.18)}
.urctl{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top));z-index:50;
  display:flex;gap:6px;transition:opacity .5s}
.urctl.dim{opacity:.4}
.urctl button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(0,0,0,.12);
  background:rgba(255,255,255,.85);color:#1a1a1a;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.urctl button svg{width:19px;height:19px;display:block}
.urctl button:disabled{opacity:.32;cursor:default}
body[data-theme="offwhite"] .urctl button{background:rgba(255,255,255,.85);color:#2a2620}
body[data-theme="black"] .urctl button{background:rgba(20,20,20,.85);color:#f2f2f2;border-color:rgba(255,255,255,.18)}
@media (pointer:coarse){
  .urctl{right:12px;top:calc(12px + env(safe-area-inset-top))}
  .urctl button{width:34px;height:34px;border-radius:10px}
  .urctl button svg{width:17px;height:17px}
}
#selbar{position:fixed;z-index:60;display:none;transform:translate(-50%,-100%);
  background:#1a1a1a;border-radius:999px;padding:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.3)}
#selbar.show{display:block}
#selbar button{width:36px;height:36px;border-radius:50%;border:none;background:#c0392b;
  color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
#selbar button svg{width:19px;height:19px;display:block}
#selbar button:active{transform:scale(.9)}
#hintbar{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:60;background:#1a1a1a;color:#fff;font-size:.85rem;font-weight:600;padding:9px 18px;
  border-radius:999px;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
body[data-theme="black"] #hintbar{background:#f2f2f2;color:#000}
#hintbar.show{display:block}

/* ---------- text overlay ---------- */
#textWrap{position:fixed;z-index:70;display:none;flex-direction:column;gap:6px;
  background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.14);border-radius:14px;
  padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.22);max-width:min(78vw,340px)}
body[data-theme="black"] #textWrap{background:rgba(18,18,18,.97);border-color:rgba(255,255,255,.2)}
#fmtbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#fmtbar select{font-size:.8rem;padding:5px 6px;border-radius:8px;border:1px solid rgba(0,0,0,.15);
  background:#fff;color:#1a1a1a;max-width:118px}
body[data-theme="black"] #fmtbar select{background:#111;color:#f2f2f2;border-color:rgba(255,255,255,.25)}
.fbtn{width:32px;height:32px;border-radius:8px;border:1px solid rgba(0,0,0,.15);background:#fff;
  font-size:.95rem;cursor:pointer;color:#1a1a1a;display:flex;align-items:center;justify-content:center}
body[data-theme="black"] .fbtn{background:#111;color:#f2f2f2;border-color:rgba(255,255,255,.25)}
.fbtn.on{background:#1a1a1a;color:#fff}
body[data-theme="black"] .fbtn.on{background:#f2f2f2;color:#000}
.fbtn.b{font-weight:800}.fbtn.i{font-style:italic}.fbtn.s{text-decoration:line-through}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.swatch.on{border-color:#1a1a1a;box-shadow:0 0 0 2px #fff,0 0 0 4px #1a1a1a}
body[data-theme="black"] .swatch.on{border-color:#fff;box-shadow:0 0 0 2px #000,0 0 0 4px #fff}
#customColor{width:32px;height:32px;border:none;border-radius:8px;padding:0;background:none;cursor:pointer}
#textArea{width:100%;min-height:88px;border:none;outline:none;resize:none;font-size:18px;
  background:transparent;color:#1a1a1a;font-family:inherit;padding:2px}
body[data-theme="black"] #textArea{color:#f2f2f2}
.textbtns{display:flex;gap:6px;justify-content:flex-end}
.tbtn{border:none;border-radius:10px;padding:8px 16px;font-size:.9rem;font-weight:700;cursor:pointer}
.tbtn.done{background:#1a1a1a;color:#fff}
body[data-theme="black"] .tbtn.done{background:#f2f2f2;color:#000}
.tbtn.cancel{background:rgba(0,0,0,.07);color:inherit}
body[data-theme="black"] .tbtn.cancel{background:rgba(255,255,255,.12)}

/* ---------- draw popover ---------- */
#drawPop{position:fixed;z-index:60;display:none;gap:8px;align-items:center;
  background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.14);border-radius:14px;
  padding:8px 10px;box-shadow:0 10px 26px rgba(0,0,0,.2)}
body[data-theme="black"] #drawPop{background:rgba(18,18,18,.97);border-color:rgba(255,255,255,.2)}
.wwidth{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.wwidth.on{border-color:#1a1a1a}
body[data-theme="black"] .wwidth.on{border-color:#fff}
.wwidth span{display:block;border-radius:50%;background:#1a1a1a}
body[data-theme="black"] .wwidth span{background:#f2f2f2}

/* ---------- modal / sheets ---------- */
#modalRoot:empty{display:none}
.modalback{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;color:#1a1a1a;width:100%;max-width:520px;max-height:82vh;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  animation:sheetup .25s ease-out}
body[data-theme="offwhite"] .sheet{background:#fffdf8}
body[data-theme="black"] .sheet{background:#141414;color:#f2f2f2}
@keyframes sheetup{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{margin:.2rem 0 1rem;font-size:1.2rem;letter-spacing:-.01em}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid rgba(0,0,0,.08);
  font-size:1rem;font-weight:600;cursor:pointer}
body[data-theme="black"] .mrow{border-color:rgba(255,255,255,.1)}
.mrow .e{width:30px;display:flex;justify-content:center;color:#8a8a8a;flex:none}
.mrow .e svg{width:20px;height:20px;display:block}
body[data-theme="black"] .mrow .e{color:#9a9a9a}
.mrow .grow{flex:1}
.mrow.danger{color:#c0392b}
.guide{display:flex;flex-direction:column;gap:11px;margin:8px 0 6px}
.guide div{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;line-height:1.45}
.guide b{flex:none;min-width:104px}
body[data-theme="black"] .mrow.danger{color:#e07f70}
.seg{display:flex;gap:8px;margin:4px 0 12px}
.seg button{flex:1;border:1px solid rgba(0,0,0,.16);background:none;color:inherit;border-radius:12px;
  padding:10px 4px;font-size:.88rem;font-weight:700;cursor:pointer}
.seg button.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
body[data-theme="black"] .seg button.on{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.field{margin:10px 0}
.field label{display:block;font-size:.78rem;font-weight:700;opacity:.65;margin-bottom:5px}
.field input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.16);
  font-size:.95rem;background:transparent;color:inherit}
.btnrow{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;border:none;border-radius:14px;padding:13px;font-size:.95rem;font-weight:700;cursor:pointer;
  background:#1a1a1a;color:#fff}
body[data-theme="black"] .btn{background:#f2f2f2;color:#000}
.btn.ghost{background:rgba(0,0,0,.07);color:inherit}
body[data-theme="black"] .btn.ghost{background:rgba(255,255,255,.12)}
.btn.dangerb{background:#c0392b;color:#fff}
.small{font-size:.82rem;opacity:.65}
.center{text-align:center}
#capPreview{width:100%;border-radius:12px;border:1px solid rgba(0,0,0,.15);display:block}
.klogo{width:120px;display:block;margin:10px auto;opacity:.9}
body[data-theme="black"] .klogo{filter:grayscale(1) invert(1)}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(8px);
  background:#1a1a1a;color:#fff;font-size:.88rem;font-weight:600;padding:10px 20px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:150;white-space:nowrap}
body[data-theme="black"] #toast{background:#f2f2f2;color:#000}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-theme="white" data-mode="navigate">

<div id="splash">
  <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="9" y="13" width="46" height="39" rx="9" stroke="currentColor" stroke-width="4.5"/>

</div>

  <button id="btnUndo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a6 6 0 0 1 0 12h-3"/></svg></button>
  <button id="btnRedo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5l5 5-5 5"/><path d="M21 10H10a6 6 0 0 0 0 12h3"/></svg></button>
</div>
<div id="selbar"><button id="selDel" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7"/><path d="M6.5 7l.9 12.2a1 1 0 0 0 1 .8h7.2a1 1 0 0 0 1-.8L17.5 7"/><path d="M10 11v6M14 11v6"/></svg></button></div>

<div class="fabs" id="fabs">
  <button class="fab" id="fabDraw" aria-label="Draw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.2-4.2L16.7 4.3a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8.2 18.8 4 20z"/><path d="M14.8 6.2l2.9 2.9"/></svg></button>
  <button class="fab" id="fabSticky" aria-label="Sticky note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5h10l5 5v12h-15.5z"/><path d="M15.5 3.5v5h5"/></svg></button>
  <button class="fab" id="fabCap" aria-label="Capture"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="1.5" stroke-dasharray="3.5 2.6"/></svg></button>
  <button class="fab" id="fabMenu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg></button>
</div>

<div id="drawPop" aria-hidden="true"></div>

<div id="textWrap">
  <div id="fmtbar">
    <select id="fFont" aria-label="Font"></select>
    <button class="fbtn b" id="fBold" aria-label="Bold">B</button>
    <button class="fbtn i" id="fItalic" aria-label="Italic">I</button>

<script>
"use strict";
/* ============================================================
   UNFOLD v1.0 — infinite canvas notes. Offline-first, single file.
   ============================================================ */
const $=id=>document.getElementById(id);
function uid(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16); });
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const DB={
  get(k,d){ try{ const v=localStorage.getItem("unfold_"+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("unfold_"+k,JSON.stringify(v)); }
    catch(e){ toast("Storage full — could not save."); } },
  del(k){ try{ localStorage.removeItem("unfold_"+k); }catch(e){} },
  keys(){ const o=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&k.indexOf("unfold_")===0) o.push(k); } return o; }
};
let toastTO=null;
function toast(msg,ms){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTO); toastTO=setTimeout(()=>t.classList.remove("show"),ms||2200);
}
function openModal(html){
  $("modalRoot").innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()">
    <div class="sheet">${html}</div></div>`;
}
function closeModal(){ $("modalRoot").innerHTML=""; }

/* ---------- themes ---------- */
const THEMES={
  white:   {bg:"#ffffff", ink:"#1a1a1a"},
  offwhite:{bg:"#f6f1e7", ink:"#2a2620"},
  black:   {bg:"#000000", ink:"#f2f2f2"}
};
let theme=DB.get("theme","white");
if(!THEMES[theme]) theme="white";
function applyTheme(){
  document.body.dataset.theme=theme;
  document.querySelector('meta[name="theme-color"]').setAttribute("content",THEMES[theme].bg);
  render();
}
function setTheme(t){ theme=t; DB.set("theme",t); applyTheme(); }

/* ---------- state ---------- */
let objects=DB.get("note_v1",{objects:[],updatedAt:0}).objects||[];
let updatedAt=DB.get("note_v1",{objects:[],updatedAt:0}).updatedAt||0;
let view=DB.get("view",{x:0,y:0,z:1});
if(typeof view.z!=="number"||view.z<=0) view={x:0,y:0,z:1};
let mode="navigate";           // navigate | draw | capture
let drawColor=DB.get("drawColor",null);   // null => theme ink at stroke time
let drawWidth=DB.get("drawWidth",4);
let saveTO=null;
function saveLocal(){
  updatedAt=Date.now();
  clearTimeout(saveTO);
  saveTO=setTimeout(()=>{ DB.set("note_v1",{objects,updatedAt}); DB.set("view",view); queuePush(); },350);
}
function inkDefault(){ return THEMES[theme].ink; }

/* ---------- canvas / view ---------- */
const cv=$("board"), ctx=cv.getContext("2d");
let dpr=1;
function sizeCanvas(){
  dpr=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr);
  cv.style.width=innerWidth+"px"; cv.style.height=innerHeight+"px";
  render();
}
window.addEventListener("resize",sizeCanvas);
const w2sX=wx=>(wx-view.x)*view.z, w2sY=wy=>(wy-view.y)*view.z;
const s2wX=sx=>sx/view.z+view.x,  s2wY=sy=>sy/view.z+view.y;
function clampZoom(z){ return Math.min(4,Math.max(0.25,z)); }
function zoomAt(sx,sy,nz){
  nz=clampZoom(nz);
  const wx=s2wX(sx), wy=s2wY(sy);
  view.z=nz; view.x=wx-sx/nz; view.y=wy-sy/nz;
  saveLocal(); render();
}
$("zin").onclick=()=>zoomAt(innerWidth/2,innerHeight/2,view.z*1.25);
$("zout").onclick=()=>zoomAt(innerWidth/2,innerHeight/2,view.z/1.25);

/* ---------- fonts ---------- */
const FONTS=[
  {n:"Sans",      f:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif'},
  {n:"Serif",     f:'Georgia,"Times New Roman",serif'},
  {n:"Mono",      f:'ui-monospace,"SF Mono",Menlo,Consolas,monospace'},
  {n:"Rounded",   f:'ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif'},
  {n:"Hand",      f:'"Segoe Print","Bradley Hand","Comic Sans MS",cursive'},
  {n:"Times",     f:'"Times New Roman",Times,serif'},
  {n:"Trebuchet", f:'"Trebuchet MS","Segoe UI",sans-serif'},
  {n:"Verdana",   f:'Verdana,Geneva,sans-serif'}
];
const SWATCHES=["#1a1a1a","#c0392b","#e67e22","#1e8e4d","#2468c9","#7d3fc4","#c9407d","#6b7280"];
const STICKY_COLORS=["#FFE066","#FFB3C7","#B5E48C","#A8E6CF","#C7B9FF"];
const STICKY_INK="#33302a";
function shade(hex,amt){ // amt -100..100: darken/lighten a #rrggbb color
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}
function rr(c,x,y,w,h,r){ // rounded-rect path (native when available)
  c.beginPath();
  if(c.roundRect){ c.roundRect(x,y,w,h,r); return; }
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function wrapText(c,text,x,y,maxW,lh){
  const words=String(text).split(/\s+/); let line="", yy=y;
  for(const wd of words){
    const t=line?line+" "+wd:wd;
    if(c.measureText(t).width>maxW&&line){ c.fillText(line,x,yy); line=wd; yy+=lh; }
    else line=t;
  }
  if(line) c.fillText(line,x,yy);
  return yy-y+lh;
}
function fontOf(o){
  const fam=(FONTS.find(f=>f.n===o.font)||FONTS[0]).f;
  return `${o.italic?"italic ":""}${o.bold?"700 ":""}${o.size}px ${fam}`;
}
function measureText(o){
  if(o._mw!=null&&o._key===textKey(o)) return {w:o._mw,h:o._mh};
  ctx.save(); ctx.font=fontOf(o);
  const lines=String(o.text).split("\n");
  let w=0; lines.forEach(l=>{ w=Math.max(w,ctx.measureText(l).width); });
  ctx.restore();
  o._mw=w; o._mh=lines.length*o.size*1.24; o._key=textKey(o);
  return {w:o._mw,h:o._mh};
}
function textKey(o){ return [o.text,o.font,o.size,o.bold,o.italic].join("|"); }

/* ---------- render ---------- */
let renderQueued=false, fx=[];
function render(){ if(renderQueued) return; renderQueued=true;
  requestAnimationFrame(()=>{ renderQueued=false; drawAll(); }); }
function drawObject(c,o,scale){
  if(o.kind==="stroke"){
    const pts=o.points; if(!pts||!pts.length) return;
    c.strokeStyle=o.color; c.lineWidth=o.width*scale; c.lineCap="round"; c.lineJoin="round";
    c.beginPath();
    if(pts.length===1){ const p=pts[0];
      c.arc(p[0]*scale,p[1]*scale,Math.max(0.6,o.width*scale/2),0,7); c.fillStyle=o.color; c.fill(); return; }
    c.moveTo(pts[0][0]*scale,pts[0][1]*scale);
    for(let i=1;i<pts.length-1;i++){
      const mx=(pts[i][0]+pts[i+1][0])/2*scale, my=(pts[i][1]+pts[i+1][1])/2*scale;
      c.quadraticCurveTo(pts[i][0]*scale,pts[i][1]*scale,mx,my);
    }
    const l=pts[pts.length-1]; c.lineTo(l[0]*scale,l[1]*scale); c.stroke();
    if(selId===o.id){ const b=objBBox(o);
      c.strokeStyle=theme==="black"?"rgba(242,242,242,.75)":"rgba(26,26,26,.55)";
      c.lineWidth=1.6*scale; c.setLineDash([7*scale,5*scale]);
      rr(c,b.x*scale,b.y*scale,b.w*scale,b.h*scale,8*scale); c.stroke(); c.setLineDash([]); }
  }else if(o.kind==="text"){
    c.font=fontOf(o); c.fillStyle=o.color; c.textBaseline="top";
    const lines=String(o.text).split("\n"), lh=o.size*1.24;
    lines.forEach((ln,i)=>{ c.fillText(ln,o.x*scale,(o.y+i*lh)*scale); });
    if(o.strike){ const m=measureText(o), ymid=(o.y+m.h/2)*scale;
      c.strokeStyle=o.color; c.lineWidth=Math.max(1,o.size*scale/14);
      c.beginPath(); c.moveTo(o.x*scale,ymid); c.lineTo((o.x+m.w)*scale,ymid); c.stroke(); }
    if(selId===o.id){ const m2=measureText(o);
      c.strokeStyle=theme==="black"?"rgba(242,242,242,.75)":"rgba(26,26,26,.55)";
      c.lineWidth=1.6*scale; c.setLineDash([7*scale,5*scale]);
      rr(c,o.x*scale-8*scale,o.y*scale-8*scale,(m2.w+16)*scale,(m2.h+16)*scale,8*scale);
      c.stroke(); c.setLineDash([]); }
  }else if(o.kind==="sticky"){
    const x=o.x*scale, y=o.y*scale, w=o.w*scale, h=o.h*scale, rad=7*scale;
    // paper body: soft shadow + subtle vertical gradient
    c.save();
    c.shadowColor="rgba(0,0,0,.30)"; c.shadowBlur=16*scale; c.shadowOffsetY=7*scale;
    const g=c.createLinearGradient(0,y,0,y+h);
    g.addColorStop(0,shade(o.color,14)); g.addColorStop(1,shade(o.color,-8));
    c.fillStyle=g; rr(c,x,y,w,h,rad); c.fill();
    c.shadowColor="transparent"; c.shadowBlur=0; c.shadowOffsetY=0;
    // folded bottom-right corner
    const f=Math.min(30*scale,w*0.22,h*0.22);
    c.fillStyle="rgba(0,0,0,.12)";
    c.beginPath(); c.moveTo(x+w-f,y+h); c.lineTo(x+w,y+h-f); c.lineTo(x+w,y+h); c.closePath(); c.fill();
    c.fillStyle=shade(o.color,-26);
    c.beginPath(); c.moveTo(x+w-f,y+h); c.lineTo(x+w,y+h-f); c.lineTo(x+w-f,y+h-f); c.closePath(); c.fill();
    // note text, wrapped with padding
    c.fillStyle=STICKY_INK; c.font=fontOf(o); c.textBaseline="top";
    const pad=14*scale, lh=o.size*1.34*scale;
    c.save(); c.beginPath(); rr(c,x,y,w,h,rad); c.clip();
    wrapText(c,o.text||"",x+pad,y+30*scale,w-2*pad,lh);
    c.restore();
    // pushpin at top center
    const px=x+w/2, py=y+5*scale, pr=7.5*scale;
    c.fillStyle="rgba(0,0,0,.22)";
    c.beginPath(); c.arc(px+2*scale,py+9*scale,pr,0,7); c.fill();
    const pg=c.createRadialGradient(px-2.5*scale,py-2.5*scale,1,px,py,pr);
    pg.addColorStop(0,"#ff9d9d"); pg.addColorStop(0.55,"#e05252"); pg.addColorStop(1,"#b03030");
    c.fillStyle=pg; c.beginPath(); c.arc(px,py,pr,0,7); c.fill();
    c.fillStyle="rgba(255,255,255,.5)";
    c.beginPath(); c.arc(px-2.5*scale,py-2.5*scale,2*scale,0,7); c.fill();
    // resize handle when this sticky is selected
    if(selId===o.id){
      const hs=15*scale, hx=x+w-hs/2, hy=y+h-hs/2;
      c.fillStyle="#fff"; c.strokeStyle="rgba(0,0,0,.45)"; c.lineWidth=1.5*scale;
      rr(c,hx,hy,hs,hs,4*scale); c.fill(); c.stroke();
      c.strokeStyle="rgba(0,0,0,.55)"; c.lineWidth=1.6*scale;
      c.beginPath();
      c.moveTo(hx+hs*0.32,hy+hs*0.68); c.lineTo(hx+hs*0.68,hy+hs*0.32);
      c.moveTo(hx+hs*0.5,hy+hs*0.68); c.lineTo(hx+hs*0.68,hy+hs*0.5);
      c.stroke();
    }
    c.restore();
  }
}
function drawAll(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=THEMES[theme].bg;
  ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.save();
  ctx.translate(-view.x*view.z,-view.y*view.z); ctx.scale(view.z,view.z);
  objects.forEach(o=>drawObject(ctx,o,1));
  // capture selection rect
  if(capSel){ const x=Math.min(capSel.x0,capSel.x1),y=Math.min(capSel.y0,capSel.y1);
    const w=Math.abs(capSel.x1-capSel.x0),h=Math.abs(capSel.y1-capSel.y0);
    ctx.strokeStyle=theme==="black"?"#f2f2f2":"#1a1a1a"; ctx.lineWidth=2/view.z;
    ctx.setLineDash([8/view.z,6/view.z]);
    ctx.strokeRect(s2wX(x),s2wY(y),w/view.z,h/view.z); ctx.setLineDash([]); }
  // erase ripples
  const now=performance.now();
  fx=fx.filter(f=>{
    const t=(now-f.t0)/380; if(t>=1) return false;
    ctx.strokeStyle=theme==="black"?"rgba(242,242,242,.7)":"rgba(26,26,26,.5)";
    ctx.lineWidth=2.5/view.z;
    ctx.beginPath(); ctx.arc(f.wx,f.wy,(6+t*46)/view.z,0,7); ctx.stroke();
    return true;
  });
  if(fx.length) render();
  ctx.restore();
}
function ripple(wx,wy){ fx.push({wx,wy,t0:performance.now()}); render(); }
</script>
<script>
"use strict";
/* ================= pointer: pan / pinch / tap / long-press ================= */
const pointers=new Map();
let downInfo=null, longTO=null, activeStroke=null, pinch=null;

function cancelLong(){ clearTimeout(longTO); longTO=null; }
function armLong(wx,wy){
  cancelLong();
  longTO=setTimeout(()=>{
    longTO=null;
    const hit=hitTest(wx,wy);
    if(hit){
      selectObject(hit);
      if(downInfo) downInfo.selMove={o:hit,px:null,py:null,moved:false,hist:false};
    }
    if(downInfo) downInfo.longFired=true;
  },600);
}
cv.addEventListener("pointerdown",e=>{
  brighten();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ // start pinch
    cancelLong();
    const p=[...pointers.values()];
    pinch={d:dist(p[0],p[1]),z:view.z,cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2,
            wx:s2wX((p[0].x+p[1].x)/2),wy:s2wY((p[0].y+p[1].y)/2)};
    if(activeStroke){ finishStroke(true); }
    downInfo=null;
    return;
  }
  if(pointers.size>2) return;
  const wx=s2wX(e.clientX), wy=s2wY(e.clientY);
  downInfo={t:Date.now(),sx:e.clientX,sy:e.clientY,wx,wy,moved:false,longFired:false,id:e.pointerId};
  if(mode==="draw"){
    activeStroke={id:uid(),kind:"stroke",points:[[wx,wy]],
      color:drawColor||inkDefault(),width:drawWidth};
    pushHistory();
    objects.push(activeStroke); render();
    armLong(wx,wy);
  }else if(mode==="navigate"){
    const sel=selId&&objects.find(o=>o.id===selId);
    if(sel&&sel.kind==="sticky"&&stickyHandleHit(sel,e.clientX,e.clientY)){
      downInfo.resize={o:sel,w0:sel.w,h0:sel.h};
      cancelLong();
    }else{
      downInfo.hit=hitTest(wx,wy);
      armLong(wx,wy);
    }
  }
  // capture mode handled by its own drag logic below
});
cv.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev=pointers.get(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size>=2){
    const p=[...pointers.values()];
    const d=dist(p[0],p[1])||1;
    const nz=clampZoom(pinch.z*d/pinch.d);
    const cx=(p[0].x+p[1].x)/2, cy=(p[0].y+p[1].y)/2;
    // zoom around original midpoint world point, then pan by midpoint delta
    view.z=nz; view.x=pinch.wx-cx/nz; view.y=pinch.wy-cy/nz;
    render(); return;
  }
  if(!downInfo||e.pointerId!==downInfo.id) return;
  const dx=e.clientX-downInfo.sx, dy=e.clientY-downInfo.sy;
  if(Math.hypot(dx,dy)>10) downInfo.moved=true;
  if(Math.hypot(dx,dy)>12) cancelLong();
  if(mode==="capture"){ capDrag(e.clientX,e.clientY); return; }
  if(mode==="draw"&&activeStroke){
    const wx=s2wX(e.clientX), wy=s2wY(e.clientY);
    const pts=activeStroke.points, last=pts[pts.length-1];
    if(Math.hypot(wx-last[0],wy-last[1])>1.5/view.z){ pts.push([wx,wy]); render(); }
    return;
  }
  if(downInfo.resize){
    const r=downInfo.resize;
    r.o.w=Math.max(STICKY_MIN,r.w0+(e.clientX-downInfo.sx)/view.z);
    r.o.h=Math.max(STICKY_MIN,r.h0+(e.clientY-downInfo.sy)/view.z);
    render(); return;
  }
  if(downInfo.selMove&&downInfo.longFired){
    const m=downInfo.selMove, o=m.o;
    if(m.px===null){ m.px=e.clientX; m.py=e.clientY; }
    const dx=(e.clientX-m.px)/view.z, dy=(e.clientY-m.py)/view.z;
    m.px=e.clientX; m.py=e.clientY;
    if(dx||dy){
      m.moved=true;
      if(!m.hist){ m.hist=true; pushHistory(); }
      if(o.kind==="stroke"){ o.points.forEach(p=>{ p[0]+=dx; p[1]+=dy; }); }
      else{ o.x+=dx; o.y+=dy; }
      positionSelBar(); render();
    }
    return;
  }
  if(mode==="navigate"&&downInfo.moved){
    view.x-=(e.clientX-prev.x)/view.z; view.y-=(e.clientY-prev.y)/view.z;
    saveLocal(); render();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(!downInfo||e.pointerId!==downInfo.id){ if(pointers.size===0){downInfo=null;cancelLong();} return; }
  const d=downInfo; downInfo=null; cancelLong();
  if(activeStroke){ finishStroke(false); }
  if(pointers.size>0) return;
  const dt=Date.now()-d.t;
  if(d.resize){ saveLocal(); render(); return; }
  if(d.longFired){
    if(d.selMove&&d.selMove.moved){ saveLocal(); render(); }
    return;
  }
  if(!d.moved&&dt<300&&mode==="navigate") handleTap(d.wx,d.wy);
}
cv.addEventListener("pointerup",endPointer);
cv.addEventListener("pointercancel",e=>{ pointers.delete(e.pointerId); pinch=null;
  if(activeStroke) finishStroke(true); downInfo=null; cancelLong(); });
cv.addEventListener("wheel",e=>{
  e.preventDefault(); brighten();
  zoomAt(e.clientX,e.clientY,view.z*(e.deltaY<0?1.12:1/1.12));
},{passive:false});
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

/* ================= hit test + erase ================= */
function ptSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay, L=dx*dx+dy*dy;
  let t=L?((px-ax)*dx+(py-ay)*dy)/L:0; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function hitTest(wx,wy){
  const tol=14/view.z;
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    if(o.kind==="sticky"){
      if(wx>=o.x-tol&&wx<=o.x+o.w+tol&&wy>=o.y-tol&&wy<=o.y+o.h+tol) return o;
    }else if(o.kind==="text"){
      const m=measureText(o);
      if(wx>=o.x-tol&&wx<=o.x+m.w+tol&&wy>=o.y-tol&&wy<=o.y+m.h+tol) return o;
    }else{
      const pts=o.points;
      for(let j=0;j<pts.length-1;j++){
        if(ptSeg(wx,wy,pts[j][0],pts[j][1],pts[j+1][0],pts[j+1][1])<tol+o.width/2) return o;
      }
      if(pts.length===1&&Math.hypot(wx-pts[0][0],wy-pts[0][1])<tol+o.width) return o;
    }
  }
  return null;
}
function eraseObject(o,wx,wy){
  pushHistory();
  objects=objects.filter(x=>x.id!==o.id);
  ripple(wx,wy); saveLocal(); render(); toast("Erased");
}

/* ================= sticky notes ================= */
let selId=null; // id of the selected object (long-press): shows move/delete UI
const STICKY_MIN=120;
/* ---------- undo / redo ---------- */
let histU=[], histR=[];
function snap(){ return JSON.stringify({objects:objects,updatedAt:updatedAt}); }
function pushHistory(){
  histU.push(snap()); if(histU.length>60) histU.shift(); histR=[]; updateUR();
}
function restoreSnap(s){
  const d=JSON.parse(s); objects=d.objects; updatedAt=d.updatedAt;
  DB.set("note_v1",{objects,updatedAt}); deselect(); render();
}
function undo(){
  if(!histU.length) return;
  histR.push(snap()); restoreSnap(histU.pop()); updateUR(); queuePush();
}
function redo(){
  if(!histR.length) return;
  histU.push(snap()); restoreSnap(histR.pop()); updateUR(); queuePush();
}
function updateUR(){
  $("btnUndo").disabled=!histU.length; $("btnRedo").disabled=!histR.length;
}
$("btnUndo").onclick=()=>{ brighten(); undo(); };
$("btnRedo").onclick=()=>{ brighten(); redo(); };
document.addEventListener("keydown",e=>{
  const tag=document.activeElement&&document.activeElement.tagName;
  if(/INPUT|TEXTAREA|SELECT/.test(tag||"")) return;
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(mod&&!e.shiftKey&&k==="z"){ e.preventDefault(); undo(); }
  else if(mod&&(k==="y"||(e.shiftKey&&k==="z"))){ e.preventDefault(); redo(); }
});
/* ---------- selection ---------- */
function objBBox(o){
  if(o.kind==="sticky") return {x:o.x,y:o.y,w:o.w,h:o.h};
  if(o.kind==="text"){ const m=measureText(o); return {x:o.x,y:o.y,w:m.w,h:m.h}; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  (o.points||[]).forEach(p=>{ x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]);
    x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); });
  if(x1<x0){ x0=o.x||0; y0=o.y||0; x1=x0+10; y1=y0+10; }
  const pad=(o.width||4)/2+6;
  return {x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2};
}
function selectObject(o){
  selId=o.id; render(); positionSelBar();
}
function deselect(){
  if(!selId) return;
  selId=null; $("selbar").classList.remove("show"); render();
}
function positionSelBar(){
  const o=objects.find(x=>x.id===selId);
  const bar=$("selbar");
  if(!o){ bar.classList.remove("show"); return; }
  const b=objBBox(o);
  let sx=(b.x+b.w/2-view.x)*view.z, sy=(b.y-view.y)*view.z-16;
  sx=Math.max(40,Math.min(innerWidth-40,sx));
  sy=Math.max(60,sy);
  bar.style.left=sx+"px"; bar.style.top=sy+"px";
  bar.classList.add("show");
}
$("selDel").onclick=()=>{
  const o=objects.find(x=>x.id===selId);
  if(o) eraseObject(o,(o.x||0),(o.y||0));
  deselect();
};
function addSticky(){
  const w=230,h=230;
  const wx=s2wX(innerWidth/2)-w/2, wy=s2wY(innerHeight/2)-h/2;
  const o={id:uid(),kind:"sticky",x:wx,y:wy,w,h,
    color:fmt.paper||STICKY_COLORS[0],text:"",font:fmt.font,size:fmt.size,
    bold:false,italic:false};
  pushHistory();
  objects.push(o); saveLocal(); render();
  openTextEditor(wx+24,wy+44,o);
}
function stickyHandleHit(o,sx,sy){ // screen-space test on the resize handle
  const hx=w2sX(o.x+o.w), hy=w2sY(o.y+o.h);
  return Math.abs(sx-hx)<24&&Math.abs(sy-hy)<24;
}
$("fabSticky").onclick=()=>{ brighten(); addSticky(); };
function finishStroke(cancelled){
  const s=activeStroke; activeStroke=null;
  if(cancelled&&s){ objects=objects.filter(o=>o.id!==s.id); }
  saveLocal(); render();
}
$("fabDraw").onclick=()=>{
  if(mode==="capture") exitCapture();
  if(mode==="draw"){ setMode("navigate"); }
  else{ setMode("draw"); showDrawPop(); }
  brighten();
};
function setMode(m){
  mode=m; document.body.dataset.mode=m;
  $("fabDraw").classList.toggle("on",m==="draw");
  $("fabCap").classList.toggle("on",m==="capture");
  if(m!=="draw") $("drawPop").style.display="none";
  hint(m==="capture"?"Drag to select an area":"");
}
function showDrawPop(){
  const p=$("drawPop");
  p.innerHTML=[2,4,7].map(w=>
    `<button class="wwidth${w===drawWidth?" on":""}" data-w="${w}" aria-label="Width ${w}">
       <span style="width:${w*2.4}px;height:${w*2.4}px"></span></button>`).join("");
  p.querySelectorAll(".wwidth").forEach(b=>b.onclick=()=>{
    drawWidth=+b.dataset.w; DB.set("drawWidth",drawWidth); showDrawPop(); });
  const r=$("fabDraw").getBoundingClientRect();
  p.style.display="flex";
  p.style.right="76px"; p.style.bottom=(innerHeight-r.bottom+4)+"px";
  p.style.left="auto"; p.style.top="auto";
}
</script>
<script>
"use strict";
/* ================= tap-to-write text ================= */
let editTarget=null, editWX=0, editWY=0, editingSticky=false;
const fmt={font:"Sans",size:22,bold:false,italic:false,strike:false,color:null,paper:STICKY_COLORS[0],list:null};
function handleTap(wx,wy){
  const hit=hitTest(wx,wy);
  if(hit&&hit.kind==="sticky"){ selId=hit.id; openTextEditor(wx,wy,hit); }
  else{
    deselect();
    if(hit&&hit.kind==="text"){ openTextEditor(wx,wy,hit); }
    else openTextEditor(wx,wy,null);
  }
}
function buildSwatches(){
  const cols=editingSticky?STICKY_COLORS:SWATCHES;
  $("swatches").innerHTML=cols.map(c=>
    `<button class="swatch" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("");
  $("swatches").querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{
    if(editingSticky) fmt.paper=b.dataset.c; else fmt.color=b.dataset.c;
    syncFmtUI(); applyFmtToArea(); });

<script>
"use strict";
/* ================= cloud sync (Supabase, plain fetch — no SDK) =================
   Same project as Steady. One row per user in public.unfold_note. */
const DEFAULT_URL="https://ueqkziijaqhknwvrkbiw.supabase.co";
const DEFAULT_KEY="sb_publishable_lTgy0kM6l5aRcRt-BLxC8Q_kkh_mjUX"; /* publishable client key: safe to ship in the app, RLS guards the data */
function cloudCfg(){
  return {url:DEFAULT_URL,key:DEFAULT_KEY};
}
function setSyncMsg(m){ const el=$("syncMsg"); if(el) el.textContent=m; }
/* ================= cloud: dead-simple username login =================
   No email, no verification mails, no Supabase Auth. One shared backend;
   the login only divides data per user. The password never leaves the
   device in cleartext: we send SHA-256 hex of 'unfold:v1:<user>:<pw>'
   and the server stores that hash. */
async function sha256hex(str){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function tok(){ const s=DB.get("session",null); return (s&&s.token&&s.exp>Date.now())?s:null; }
function rpc(name,body){
  const c=cloudCfg();
  return fetch(c.url+"/rest/v1/rpc/"+name,{method:"POST",
    headers:{"apikey":c.key,"Content-Type":"application/json"},
    body:JSON.stringify(body||{})});
}
function openCloud(){
  const s=tok();
  openModal(`<h2>Cloud login</h2>
    ${s?`<p class="small">Logged in as <b>${esc(s.username)}</b></p>
      <p class="small" id="syncMsg">${esc(syncLine())}</p>
      <div class="btnrow">
        <button class="btn ghost" onclick="cloudLogout()">Log out</button>
      </div>`
    :`<div class="field"><label>Username</label>
        <input id="cl_user" placeholder="pick a unique username" autocapitalize="none" autocomplete="username" spellcheck="false"></div>
      <div class="field"><label>Password</label>
        <input id="cl_pw" type="password" placeholder="Min 8 characters" autocomplete="current-password"></div>
      <div class="btnrow">
        <button class="btn" onclick="cloudSignup()">Sign up</button>
        <button class="btn ghost" onclick="cloudLogin()">Log in</button>
      </div>
      <p class="small" id="syncMsg">${esc(syncLine())}</p>`}
    <p class="small">Just a username + password — no email, no verification mails.
    Your note syncs automatically on every edit while you're logged in.</p>
    <div class="btnrow"><button class="btn ghost" onclick="openMenu()">Back</button></div>`);
}
function validUsername(u){ return /^[a-z0-9_]{3,20}$/.test(u||""); }
async function cloudSignup(){
  const u=$("cl_user").value.trim().toLowerCase(), pw=$("cl_pw").value;
  if(!validUsername(u)){ toast("Username: 3-20 chars, letters/numbers/_"); return; }
  if(pw.length<8){ toast("Password needs at least 8 characters."); return; }
  setSyncMsg("Signing up…");
  try{
    const r=await rpc("unfold_signup",{p_username:u,p_pw_hash:await sha256hex("unfold:v1:"+u+":"+pw)});
    const t=await r.json().catch(()=>null);
    if(!r.ok) throw new Error((t&&t.message)||"signup failed");
    DB.set("session",{token:t,username:u,exp:Date.now()+90*864e5});
    toast("Welcome, "+u+"."); openCloud(); autoSync();
  }catch(e){
    setSyncMsg(/taken/.test(e.message)?"That username is taken — try another.":"Sign up failed: "+e.message);
  }
}
async function cloudLogin(){
  const u=$("cl_user").value.trim().toLowerCase(), pw=$("cl_pw").value;
  if(!u||!pw){ toast("Enter your username and password."); return; }
  setSyncMsg("Logging in…");
  try{
    const r=await rpc("unfold_login",{p_username:u,p_pw_hash:await sha256hex("unfold:v1:"+u+":"+pw)});
    const t=await r.json().catch(()=>null);
    if(!r.ok) throw new Error((t&&t.message)||"login failed");
    DB.set("session",{token:t,username:u,exp:Date.now()+90*864e5});
    toast("Welcome back, "+u+"."); openCloud(); autoSync();
  }catch(e){
    setSyncMsg(/bad-login/.test(e.message)?"Wrong username or password.":"Login failed: "+e.message);
  }
}
function cloudLogout(){
  DB.set("session",null); toast("Logged out — note stays on this device."); openCloud();
}
/* ---------- auto-sync: login-based, always on ----------
   No manual sync button. Logged in => every edit is pushed
   automatically (debounced); latest note is pulled on boot,
   on login, and whenever the app comes back to the foreground.
   Last-write-wins via updated_at. Offline edits stay on the
   device and upload on their own once online again. */
let pushTO=null, syncing=false;
function syncStatus(msg){
  DB.set("syncstate",Object.assign(DB.get("syncstate",{}),{msg:msg,at:Date.now()}));
  setSyncMsg(msg);
}
function syncLine(){
  const s=tok(), sy=DB.get("syncstate",{});
  if(!s) return "Log in and your note syncs automatically on every edit.";
  return sy.msg||"Not synced yet.";
}
async function pullCloud(){
  const s=tok(); if(!s) return false;
  const r=await rpc("unfold_pull",{p_tok:s.token});
  if(!r.ok) throw new Error("pull "+r.status);
  const rows=await r.json();
  if(rows.length){
    const rt=Date.parse(rows[0].updated_at)||0;
    if(rt>updatedAt&&rows[0].data&&Array.isArray(rows[0].data.objects)){
      pushHistory();
      objects=rows[0].data.objects; updatedAt=rt;
      DB.set("note_v1",{objects,updatedAt}); DB.set("dirty",false); render();
      return true;
    }
  }
  return false;
}
async function pushCloud(){
  const s=tok(); if(!s||syncing) return;
  syncing=true; syncStatus("Syncing…");
  try{
    const r=await rpc("unfold_push",{p_tok:s.token,p_data:{objects},
      p_updated:new Date(updatedAt||Date.now()).toISOString()});
    if(!r.ok) throw new Error("push "+r.status);
    DB.set("dirty",false);
    syncStatus("Synced ✓ "+new Date().toLocaleTimeString());
  }catch(e){
    DB.set("dirty",true);
    syncStatus("Couldn\u2019t sync — saved on this device, will retry automatically.");
  }finally{ syncing=false; }
}
function queuePush(){
  if(!tok()) return;
  DB.set("dirty",true);
  clearTimeout(pushTO);
  pushTO=setTimeout(pushCloud,2000);
}
async function autoSync(){
  if(!tok()) return;
  syncStatus("Syncing…");
  try{ await pullCloud(); await pushCloud(); }
  catch(e){
    DB.set("dirty",true);
    syncStatus("Couldn\u2019t sync — saved on this device, will retry automatically.");
  }
}
window.addEventListener("online",()=>{ if(DB.get("dirty",false)) pushCloud(); });
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) pullCloud().catch(()=>{});
});

    if(deferredPrompt){ showInstallSheet(false); }
    else if(isiOS&&!DB.get("install_ios_hint",false)){
      DB.set("install_ios_hint",true); showInstallSheet(true);
    }
  }catch(e){ /* never break boot */ }
}
function showInstallSheet(ios){
  openModal(`<h2 class="center">Install Unfold?</h2>
    <p class="center">Add Unfold to your home screen — it opens full-screen
    and works offline, like a real app.</p>
    ${ios?`<p class="center small">Tap <b>Share</b> → <b>Add to Home Screen</b> to install.</p>`:""}
    <div class="btnrow">
      ${ios?`<button class="btn" onclick="closeModal()">Got it</button>`
           :`<button class="btn" onclick="doInstall()">Install</button>`}
      <button class="btn ghost" onclick="snoozeInstall()">Not now</button>
    </div>`);
}
async function doInstall(){
  closeModal();
  if(!deferredPrompt) return;
  try{ deferredPrompt.prompt(); await deferredPrompt.userChoice; }
  catch(e){}
  deferredPrompt=null;
}
function snoozeInstall(){
  DB.set("install_snooze",Date.now()+7*864e5);
  closeModal();
}

/* ================= splash + boot ================= */
function hideSplash(){
  const s=$("splash"); if(!s||s.classList.contains("gone")) return;
  s.classList.add("gone");
  setTimeout(()=>{ if(s.parentNode) s.parentNode.removeChild(s); },500);
  maybeShowInstall();
}
function boot(){
  try{
    applyTheme();
    document.body.dataset.mode="navigate";
    sizeCanvas();
    brighten();
    render();
  }catch(e){ /* canvas must never fail boot */ }
  setTimeout(hideSplash,1500);
  setTimeout(hideSplash,5000); // hard fallback
  updateUR();
  if(tok()) autoSync().catch(()=>{});
  if(!DB.get("guideSeen",false)) setTimeout(openGuide,2100);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();
</script>
</body>
</html>
